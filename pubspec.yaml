name: muslim_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.2.0
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  code_assets: ^1.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  flutter_secure_storage: ^10.3.0
  firebase_auth: ^6.5.1
  google_sign_in: ^6.2.1
  firebase_core: ^4.9.0
  flutter_markdown_plus: ^1.0.7
  cloud_firestore: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/quran.json
    - assets/asmaul_husna.json
    - assets/doa.json
    - assets/icons/launcher_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon.png"

